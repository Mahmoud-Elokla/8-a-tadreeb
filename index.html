<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>وحوش الرياضيات</title>
<style>
:root{--bg:#f3f6ff;--cd:#fff;--tx:#14213d;--mu:#5b6785;--pri:#1d3fbf;--on:#fff;--ac:#f5b800;--ok:#1a9d55;--no:#d33b3b;--ln:#d9e0f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1426;--cd:#18213a;--tx:#eef1fb;--mu:#9aa6c8;--pri:#7d9bff;--on:#0e1426;--ln:#2b3760}}
:root[data-theme="dark"]{--bg:#0e1426;--cd:#18213a;--tx:#eef1fb;--mu:#9aa6c8;--pri:#7d9bff;--on:#0e1426;--ln:#2b3760}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.9 Tahoma,"Segoe UI","Noto Naskh Arabic",Arial,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pri);z-index:10}
#app{max-width:760px;margin:0 auto;padding:0 12px 8px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--pri);color:var(--on);padding:8px 12px;margin:0 -12px;font-weight:bold}
.pg{height:6px;background:var(--ln);margin:0 -12px}.pg i{display:block;height:100%;background:var(--ac);transition:width .3s}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
.b{font:inherit;font-weight:bold;border:0;border-radius:14px;padding:12px 18px;min-height:48px;background:var(--pri);color:var(--on);cursor:pointer}
.b.s{background:#fff3;color:inherit;padding:6px 12px;min-height:40px}.b.g{background:var(--ac);color:#14213d}.b.w{background:var(--ln);color:var(--tx)}.b:disabled{opacity:.4}
.row2{display:flex;gap:8px;flex-wrap:wrap}.row2>.b{flex:1;min-width:120px}
.hero{display:flex;align-items:center;gap:14px;padding:14px 0}.hero img{height:120px}.hero h1{font-size:24px;margin:0;color:var(--pri);line-height:1.5}.hero p{margin:0;color:var(--mu)}
.tc{width:100%;text-align:right;font:inherit;color:var(--tx);cursor:pointer;display:block}.tc.off{opacity:.55;cursor:default}.tc b{color:var(--pri)}.tc small{color:var(--mu);display:block}
.meta{color:var(--mu);font-size:15px}.q{font-size:20px;margin:8px 0}.fg{text-align:center;color:var(--tx)}.fg svg{max-width:100%;height:auto;max-height:190px}
.o{display:block;width:100%;text-align:right;font:inherit;color:var(--tx);background:var(--bg);border:2px solid var(--ln);border-radius:14px;padding:10px 14px;margin:8px 0;min-height:48px;cursor:pointer}
.o b{color:var(--pri);margin-inline-end:6px}.o.sel{border-color:var(--pri)}.o.ok{border-color:var(--ok);background:#1a9d5522}.o.no{border-color:var(--no);background:#d33b3b22}.o:disabled{opacity:1}
.ex,.sol{background:var(--bg);border-inline-start:5px solid var(--ac);border-radius:10px;padding:10px 14px;margin:10px 0}
textarea,input[type=text],#nm{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:2px solid var(--ln);border-radius:12px;padding:10px;margin:8px 0;min-height:90px}#nm{min-height:48px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin:10px 0}.pal button{font:inherit;min-height:44px;border:2px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--tx);cursor:pointer}
.pal .dn{background:#1a9d5533}.pal .fl{border-color:var(--ac);box-shadow:inset 0 -4px var(--ac)}.pal .cur{border-color:var(--pri);font-weight:bold}
.rt{display:flex;gap:6px;margin:8px 0}.rt .b{flex:1;padding:8px}.rt .on{outline:3px solid var(--pri)}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--ln)}.big{font-size:22px;font-weight:bold;color:var(--pri)}.lion{height:110px}
.f{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;font-size:.9em;line-height:1.35}.f i{font-style:normal;padding:0 .25em}.f i:first-child{border-bottom:1.5px solid currentColor}
.r b{font-weight:inherit;border-top:1.5px solid currentColor;padding:0 .15em}.h{position:relative;display:inline-block}.h::before{content:"^";position:absolute;top:-.55em;left:0;right:0;text-align:center;font-size:.9em}.ov{text-decoration:overline}
footer{text-align:center;color:var(--mu);font-size:13px;line-height:1.6;padding:14px 8px}.gd{display:flex;gap:18px}#cv img{width:100%;border-radius:10px;border:1px solid var(--ln)}
.top{flex-wrap:wrap}.u{flex-basis:100%;font-size:13px;font-weight:normal;opacity:.9}.pcn{display:block;font-size:20px;font-weight:bold;margin-top:8px}</style></head><body><div id="app"></div><footer>تصميم م. محمود العقلة © 2026<br>55942139</footer>
